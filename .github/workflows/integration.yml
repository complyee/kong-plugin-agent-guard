name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kong:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kong: ["3.9"]
    steps:
      - uses: actions/checkout@v4
      - name: Run live Kong suite
        env:
          KONG_VERSION: ${{ matrix.kong }}
        run: docker compose -f spec/integration/docker-compose.yml up --abort-on-container-exit --exit-code-from tests
      - name: Kong logs on failure
        if: failure()
        run: docker compose -f spec/integration/docker-compose.yml logs kong
      - name: Clean up
        if: always()
        run: docker compose -f spec/integration/docker-compose.yml down -v
