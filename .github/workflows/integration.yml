name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (LuaJIT)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Run unit test suite
        run: luajit spec/run.lua

  integration:
    name: Live Kong integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run live Kong integration test harness
        run: docker compose -f spec/integration/docker-compose.yml up --abort-on-container-exit --exit-code-from tests
      - name: Clean up containers
        if: always()
        run: docker compose -f spec/integration/docker-compose.yml down -v
